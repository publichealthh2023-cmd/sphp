<title>تفاصيل المرض</title>

<link rel="stylesheet" href="Style.css">

<style>

.details-page{
    max-width:1150px;
    margin:30px auto;
    padding:0 20px 50px;
}

.disease-title{
    background:white;
    border-radius:16px;
    padding:28px;
    text-align:center;
    margin-bottom:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.disease-title .big-icon{
    font-size:50px;
}

.disease-title h1{
    color:#064c92;
    margin:8px 0 4px;
}

.disease-title h2{
    color:#657789;
    margin:0;
    font-size:18px;
}

.notification-badge{
    display:inline-block;
    margin-top:15px;
    background:#c62828;
    color:white;
    padding:9px 18px;
    border-radius:25px;
    font-weight:bold;
}

.notification-badge.non-urgent{
    background:#d88900;
}

.details-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.detail-card{
    background:white;
    border:1px solid #dfe8f2;
    border-radius:14px;
    padding:23px;
    box-shadow:0 4px 13px rgba(0,0,0,.06);
}

.detail-card h3{
    color:#064c92;
    margin-top:0;
}

.detail-card ul{
    line-height:2;
    color:#40566b;
    padding-right:22px;
}

.suspected-card{
    border-right:5px solid #c62828;
    background:#fffafa;
}

.actions-card{
    border-right:5px solid #0879b2;
    background:#f7fcff;
}

.transmission-card{
    border-right:5px solid #7457a6;
}

.isolation-card{
    border-right:5px solid #15866a;
}

.warning-card{
    margin-top:18px;
    background:#fff8e1;
    border-right:5px solid #f9a825;
    border-radius:12px;
    padding:19px;
    line-height:1.8;
    color:#66531b;
}

.buttons-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:22px;
}

.buttons-row a{
    border:none;
    border-radius:9px;
    padding:13px;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.notify-btn{
    background:#c62828;
    color:white;
}

.smart-btn-details{
    background:#187b43;
    color:white;
}

.back-btn-details{
    background:#eaf1f7;
    color:#064c92;
}

.not-available{
    background:white;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.not-available h2{
    color:#064c92;
}

.reference-note{
    margin-top:20px;
    text-align:center;
    color:#758493;
    font-size:12px;
    line-height:1.8;
}

@media(max-width:750px){

    .details-grid{
        grid-template-columns:1fr;
    }

    .buttons-row{
        grid-template-columns:1fr;
    }

}

</style>

</head>

function getDiseaseKey(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("disease");

}


function createList(items){

    if(!items || items.length === 0){

        return "<li>لا توجد معلومات مدخلة حاليًا.</li>";

    }

    return items
        .map(
            item =>
            "<li>" + item + "</li>"
        )
        .join("");

}


function renderDisease(){

    const diseaseKey =
        getDiseaseKey();

    const disease =
        diseaseDatabase[
            diseaseKey
        ];

    const container =
        document.getElementById(
            "diseaseContent"
        );


    if(!disease){

        container.innerHTML = `

        <div class="not-available">

            <h2>
                المرض قيد الإضافة
            </h2>

            <p>
                هذا المرض غير موجود حاليًا
                في قاعدة بيانات الدليل.
            </p>

            <a
                href="infectious-diseases.html"
                class="back-btn-details"
                style="
                    display:inline-block;
                    padding:12px 22px;
                    border-radius:8px;
                    text-decoration:none;
                    margin-top:10px;
                ">

                ← العودة إلى قائمة الأمراض

            </a>

        </div>

        `;

        return;

    }


    const badgeClass =
        disease.urgent
        ? ""
        : " non-urgent";


    container.innerHTML = `

    <section class="disease-title">

        <div class="big-icon">
            ${disease.icon}
        </div>

        <h1>
            ${disease.arName}
        </h1>

        <h2>
            ${disease.enName}
        </h2>

        <div class="notification-badge${badgeClass}">

            ${
                disease.urgent
                ? "🚨 "
                : "📋 "
            }

            ${disease.notification}

        </div>

    </section>


    <section class="details-grid">

        <div class="detail-card suspected-card">

            <h3>
                🔎 تعريف ومعايير الاشتباه
            </h3>

            <ul>
                ${createList(
                    disease.suspected
                )}
            </ul>

        </div>


        <div class="detail-card">

            <h3>
                🌡️ الأعراض والعلامات
            </h3>

            <ul>
                ${createList(
                    disease.symptoms
                )}
            </ul>

        </div>


        <div class="detail-card transmission-card">

            <h3>
                🔄 الانتقال والتعرض
            </h3>

            <ul>
                ${createList(
                    disease.transmission
                )}
            </ul>

        </div>


        <div class="detail-card">

            <h3>
                🧪 العينات والفحوصات
            </h3>

            <ul>
                ${createList(
                    disease.specimens
                )}
            </ul>

        </div>


        <div class="detail-card isolation-card">

            <h3>
                🛡️ العزل والاحتياطات
            </h3>

            <ul>
                ${createList(
                    disease.isolation
                )}
            </ul>

        </div>


        <div class="detail-card actions-card">

            <h3>
                📋 الإجراءات المطلوبة
            </h3>

            <ul>
                ${createList(
                    disease.actions
                )}
            </ul>

        </div>

    </section>


    <section class="warning-card">

        <strong>
            ⚠️ تنبيه للممارس الصحي:
        </strong>

        هذه الصفحة أداة مساندة للوصول السريع إلى المعلومات.
        لا تستبدل الحكم السريري أو تعريف الحالة الرسمي
        أو سياسات وإجراءات المنشأة أو الإبلاغ الرسمي
        في الأنظمة الوطنية المعتمدة.

    </section>


    <section class="buttons-row">


        <a
            href="infectious-notification.html?disease=${encodeURIComponent(

            class="notify-btn">

            href="smart-screening.html"
            class="smart-btn-details">

        تعريفات الحالات والسياسات والأدلة الرسمية

document.addEventListener(
